<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroSense — Satellite Air Quality Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="container">
        <header class="header">
            <div class="satellite-icon">🛰️</div>
            <h1 class="title">AeroSense</h1>
            <p class="subtitle">AI-Powered Satellite Air Quality Intelligence</p>
            
        </header>

        <div class="card">
            <div class="card-header">
                <span class="card-icon">🌍</span>
                <h2 class="card-title">Environmental Analysis</h2>
                <p class="card-subtitle">Enter satellite & weather parameters</p>
            </div>

            <div class="form-body">
                <div class="form-group full-width">
                    <label class="label">🏙️ City</label>
                    <select id="city" class="input">
                        <option value="" disabled selected>Select an Indian city...</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Lucknow">Lucknow</option>
                        <option value="Kanpur">Kanpur</option>
                        <option value="Patna">Patna</option>
                        <option value="Kolkata">Kolkata</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Bengaluru">Bengaluru</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Hyderabad">Hyderabad</option>
                        <option value="Ahmedabad">Ahmedabad</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label class="label">🛰️ AOD — Aerosol Optical Depth <span class="aod-val" id="aod-display">0.50</span></label>
                    <input type="range" id="aod-slider" min="0" max="2" step="0.01" value="0.50" class="slider">
                    <div class="slider-labels">
                        <span>0.0 Clean</span>
                        <span>1.0 Moderate</span>
                        <span>2.0 Severe</span>
                    </div>
                    <input type="number" id="aod" min="0" max="2" step="0.01" value="0.50" class="input" style="margin-top:10px;">
                </div>

                <div class="form-group">
                    <label class="label">🌡️ Temperature (°C)</label>
                    <input type="number" id="temperature" placeholder="e.g. 34" value="34" class="input">
                </div>
                <div class="form-group">
                    <label class="label">💧 Humidity (%)</label>
                    <input type="number" id="humidity" placeholder="e.g. 68" value="68" class="input">
                </div>

                <div class="form-group">
                    <label class="label">💨 Wind Speed (m/s)</label>
                    <input type="number" id="wind_speed" step="0.1" placeholder="e.g. 2.0" value="2.0" class="input">
                </div>
                <div class="form-group">
                    <label class="label">📅 Observation Date</label>
                    <input type="date" id="date" class="input">
                </div>

                <div class="full-width">
                    <button class="btn-predict" id="predictBtn" onclick="submitPrediction()">
                        <span class="btn-rocket">🚀</span>
                        <span class="btn-text">Analyze Air Quality</span>
                    </button>
                </div>

                <div id="error-msg" class="error-msg" style="display:none;"></div>
            </div>
        </div>

        <footer class="footer">
            © 2026 AeroSense &nbsp;•&nbsp; Powered by XGBoost AI + Gemini &nbsp;•&nbsp; 🇮🇳 India
        </footer>
    </div>

    <div id="loading-overlay" class="loading-overlay" style="display:none;">
        <div class="loading-content">
            <div class="orbit-ring"><div class="orbit-dot"></div></div>
            <div class="loading-satellite">🛰️</div>
            <p class="loading-text">Analyzing satellite data<span class="dots"></span></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let mouse = { x: 0, y: 0 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 300; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.5 + 0.3,
                    speed: Math.random() * 0.3 + 0.05,
                    opacity: Math.random() * 0.8 + 0.2,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.twinkle += 0.02;
                s.opacity = 0.3 + Math.abs(Math.sin(s.twinkle)) * 0.7;
                s.y += s.speed;
                if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
                ctx.beginPath();
                ctx.arc(s.x + mouse.x * 0.02 * s.r, s.y + mouse.y * 0.02 * s.r, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('mousemove', e => {
            mouse.x = (e.clientX / window.innerWidth - 0.5) * 20;
            mouse.y = (e.clientY / window.innerHeight - 0.5) * 20;
        });

        resizeCanvas(); createStars(); drawStars();
        window.addEventListener('resize', () => { resizeCanvas(); createStars(); });

        const slider = document.getElementById('aod-slider');
        const aodNum = document.getElementById('aod');
        const aodDisp = document.getElementById('aod-display');

        slider.addEventListener('input', () => {
            aodNum.value = slider.value;
            aodDisp.textContent = parseFloat(slider.value).toFixed(2);
        });
        aodNum.addEventListener('input', () => {
            slider.value = aodNum.value;
            aodDisp.textContent = parseFloat(aodNum.value).toFixed(2);
        });

        document.getElementById('date').valueAsDate = new Date();

        let dotCount = 0;
        setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            const el = document.querySelector('.dots');
            if (el) el.textContent = '.'.repeat(dotCount);
        }, 400);

        async function submitPrediction() {
            const city        = document.getElementById('city').value;
            const aod         = document.getElementById('aod').value;
            const temperature = document.getElementById('temperature').value;
            const humidity    = document.getElementById('humidity').value;
            const wind_speed  = document.getElementById('wind_speed').value;
            const date        = document.getElementById('date').value;
            const errorEl     = document.getElementById('error-msg');

            errorEl.style.display = 'none';

            if (!city) {
                errorEl.textContent = '⚠️ Please select a city.';
                errorEl.style.display = 'block';
                return;
            }

            document.getElementById('loading-overlay').style.display = 'flex';

            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city, aod, temperature, humidity, wind_speed, date })
                });
                const json = await res.json();

                if (json.success) {
                    sessionStorage.setItem('aerosense_result', JSON.stringify(json.data));
                    window.location.href = '/result';
                } else {
                    document.getElementById('loading-overlay').style.display = 'none';
                    errorEl.textContent = '⚠️ ' + json.error;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                document.getElementById('loading-overlay').style.display = 'none';
                errorEl.textContent = '⚠️ Connection error. Is Flask running?';
                errorEl.style.display = 'block';
            }
        }

        document.getElementById('predictBtn').addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            const rect = this.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top = (e.clientY - rect.top) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 700);
        });
    </script>
</body>
</html>
